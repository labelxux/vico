<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);color:var(--deep-green);background:var(--cream);min-height:100dvh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--deep-green)}
a:hover{color:var(--tomato)}
[hidden]{display:none !important}

.btn{--btn-bg:var(--tomato);--btn-fg:var(--white);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-weight:800;line-height:1;letter-spacing:.01em;border:none;border-radius:var(--radius-pill);
  background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:filter var(--dur-fast,140ms) ease,transform var(--dur-fast,140ms) ease;box-shadow:0 8px 22px rgba(239,64,69,.28)}
.btn:hover{filter:brightness(.92);color:var(--btn-fg)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
.btn--lg{font-size:17px;padding:17px 34px}
.btn--md{font-size:15px;padding:13px 24px}
.btn--secondary{--btn-bg:transparent;--btn-fg:var(--deep-green);border:var(--stroke-thin) solid var(--deep-green);box-shadow:none}
.btn--secondary:hover{--btn-bg:var(--deep-green);--btn-fg:var(--cream);filter:none}

.jobs{flex:1 0 auto;padding:clamp(72px,12vw,140px) 24px}
.jobs__wrap{max-width:560px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.jobs__art{width:clamp(80px,14vw,120px);height:auto;margin-bottom:6px}
.jobs__kicker{font:700 13px/1 var(--font-body);letter-spacing:.14em;color:var(--tomato);text-transform:uppercase}
.jobs__title{margin:0;font:900 clamp(30px,6vw,48px)/1.1 var(--font-body);text-wrap:balance}
.jobs__text{margin:0;font:400 18px/1.65 var(--font-body);color:var(--sage-green)}
.jobs__cta{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>

:root{--font-body:"DM Sans","Kedem Sans ML AAA",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3,.kicker,.btn,.arrow-link,.dish__name,.cocktail__name,.perk__title,.tonight__eyebrow,.tonight__title,.signup__eyebrow,.signup__title,

.item__desc,.intro__card p,.intro__meta,.note p,.cta p,.jobs__text,.signup__legal,.footer__meta div,.footer__contact-row a,.footer__contact-row span,.footer__legal a
{letter-spacing:0}
</style>

<main class="jobs" aria-labelledby="jobs-title">
  <div class="jobs__wrap">
    <img class="jobs__art" src="../../assets/hiring.svg" alt="" aria-hidden="true" decoding="async" />
    <div class="jobs__kicker">Work with us</div>
    <h1 class="jobs__title" id="jobs-title">Come cook with us? VICO is hiring</h1>
    <p class="jobs__text">We're looking for people with a passion for food, hospitality and smiles. If you're over 18, shift work suits you and you'd like to be part of the team at Herzliya's neighborhood Italian — talk to us.</p>
    <div class="jobs__cta">
      <a class="btn btn--lg" dir="ltr" href="tel:0506545363">050-654-5363</a>
      <a class="btn btn--secondary btn--lg" href="https://wa.me/972506545363?text=Hi%2C%20I%27m%20interested%20in%20working%20at%20VICO" target="_blank" rel="noopener">Send a WhatsApp</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>
