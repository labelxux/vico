<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);color:var(--deep-green);background:var(--cream);min-height:100dvh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--deep-green)}
a:hover{color:var(--tomato-ink)}
[hidden]{display:none !important}

.btn{--btn-bg:var(--tomato-ink);--btn-fg:var(--white);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-body);font-weight:800;line-height:1;letter-spacing:.01em;border:none;border-radius:var(--radius-pill);
  background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:filter var(--dur-fast,140ms) ease,transform var(--dur-fast,140ms) ease;box-shadow:0 8px 22px rgba(239,64,69,.28)}
.btn:hover{filter:brightness(.92);color:var(--btn-fg)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
.btn--lg{font-size:17px;padding:17px 34px}
.btn--md{font-size:15px;padding:13px 24px}
.btn--secondary{--btn-bg:transparent;--btn-fg:var(--deep-green);border:var(--stroke-thin) solid var(--deep-green);box-shadow:none}
.btn--secondary:hover{--btn-bg:var(--deep-green);--btn-fg:var(--cream);filter:none}

.jobs{flex:1 0 auto;padding:clamp(72px,12vw,140px) 24px}
.jobs__wrap{max-width:560px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.jobs__art{width:clamp(80px,14vw,120px);height:auto;margin-bottom:6px}
.jobs__kicker{font:700 13px/1 var(--font-body);letter-spacing:.14em;color:var(--tomato-ink);text-transform:uppercase}
.jobs__title{margin:0;font:900 clamp(30px,6vw,48px)/1.1 var(--font-body);text-wrap:balance}
.jobs__text{margin:0;font:400 18px/1.65 var(--font-body);color:var(--sage-ink)}
.jobs__cta{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
